    <style>
      :root { --background-base: #000000; --accent-base: #dc2626; }
      html, body { margin: 0; background-color: var(--background-base); font-family: 'Montserrat', sans-serif; color: #ffffff; overflow-x: hidden; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none !important; }
      h1, h2, h3, h4 { font-family: 'Teko', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
      
      /* BULLETPROOF CLERK VFX BRANDING & INTERACTION FIXES */
      
      /* Force Modals to Center and Prevent Clipping */
      .cl-modalBackdrop {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: rgba(0,0,0,0.92) !important;
        backdrop-filter: none !important;
        z-index: 999999 !important;
        padding: 1rem !important;
        pointer-events: auto !important; /* Ensure the backdrop allows events to pass to content */
      }

      .cl-modalContent {
        margin: auto !important;
        max-width: 95vw !important;
        max-height: 92vh !important;
        border: none !important;
        background: #0a0a0a !important;
      }

      /* Dual-Color Neon Border: Red Left, Blue Right */
      .cl-card, .cl-userButtonPopoverCard, .cl-popover, .cl-menu {
        position: relative !important;
        background: #0a0a0a !important;
        border: 2px solid transparent !important;
        background-image: linear-gradient(#0a0a0a, #0a0a0a), linear-gradient(to right, #dc2626, #3b82f6) !important;
        background-origin: border-box !important;
        background-clip: padding-box, border-box !important;
        box-shadow: -15px 0 35px rgba(220, 38, 38, 0.3), 15px 0 35px rgba(59, 130, 246, 0.3) !important;
      }

      /* Fix for 3-dots and context menus text color */
      .cl-menuItemButton, .cl-actionButton, .cl-popover button {
        color: white !important;
      }
      .cl-menuItemButton:hover, .cl-actionButton:hover {
        background-color: rgba(255, 255, 255, 0.1) !important;
        color: #ef4444 !important; /* Red hover for actions */
      }

      /* Ensure three-dots and action menus are interactive and above everything */
      .cl-popover, .cl-menu, .cl-internal-ph79u2 {
        pointer-events: auto !important;
        z-index: 1000001 !important;
      }

      /* Mobile Center & Force Fit */
      @media (max-width: 767px) {
        .cl-userButtonPopoverCard {
          position: fixed !important;
          left: 50% !important;
          top: 50% !important;
          transform: translate(-50%, -50%) !important;
          width: 90vw !important;
          max-width: 420px !important;
        }
        .cl-modalContent {
          width: 95vw !important;
        }
        .cl-userProfile-root {
          flex-direction: column !important;
          height: 85vh !important;
        }
      }

      /* Desktop Dropdown Adjustments */
      @media (min-width: 1024px) {
        .cl-userButtonPopoverCard {
          position: fixed !important;
          right: 2.5rem !important;
          top: 5rem !important;
          margin: 0 !important;
        }
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px !important;
        display: block !important;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #dc2626 !important;
        border-radius: 10px !important;
      }
    </style>
