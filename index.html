    <meta name="theme-color" content="#000000" />
    
    <style>
      :root { --background-base: #050505; --accent-base: #ff0000; }
      html, body { margin: 0; background-color: var(--background-base); font-family: 'Montserrat', sans-serif; color: #ffffff; overflow-x: hidden; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none !important; }
      h1, h2, h3, h4 { font-family: 'Teko', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
      
      /* CLERK DARK MODE OVERRIDES */
      .cl-modalBackdrop {
        background: rgba(0,0,0,0.95) !important;
        backdrop-filter: blur(10px) !important;
      }
      .cl-card, .cl-userButtonPopoverCard, .cl-userProfile-root {
        background-color: #0a0a0a !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      .cl-headerTitle, .cl-headerSubtitle, .cl-formFieldLabel, .cl-userButtonOuterIdentifier, .cl-userButtonPopoverActionButtonText, .cl-navbarButton {
        color: white !important;
      }
      .cl-socialButtonsBlockButton {
        background-color: #18181b !important;
        border: 1px solid rgba(255, 255, 255, 0.05) !important;
      }
      .cl-socialButtonsBlockButtonText {
        color: white !important;
      }

      /* NEON GLOW CHAT BUBBLES */
      .sent-bubble {
        background: rgba(220, 38, 38, 0.1) !important;
        border: 1px solid rgba(255, 0, 0, 0.4) !important;
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.08) !important;
        backdrop-filter: blur(14px);
      }
      .received-bubble {
        background: rgba(37, 99, 235, 0.1) !important;
        border: 1px solid rgba(59, 130, 246, 0.4) !important;
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.08) !important;
        backdrop-filter: blur(14px);
      }

      /* Chat container scrollbar */
      .chat-scrollbar::-webkit-scrollbar {
        width: 3px !important;
        display: block !important;
      }
      .chat-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 0, 0, 0.5) !important;
        border-radius: 10px !important;
      }
      .chat-scrollbar::-webkit-scrollbar-track {
        background: transparent !important;
      }

      @media (max-width: 767px) {
        .cl-userButtonPopoverCard {
          right: 1.5rem !important;
          top: 5rem !important;
        }
      }
    </style>
