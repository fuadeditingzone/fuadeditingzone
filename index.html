<!DOCTYPE html>
<html lang="en" class="scroll-smooth" prefix="og: http://ogp.me/ns#">
  <head>
    <!-- [CACHE BUSTER: v12.0.0 - 2025-05-24] -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Fuad Editing Zone | Graphic Designer & VFX Editor | From Sylhet</title>
    <meta name="description" content="Official portfolio of Fuad Ahmed (Selected Legend) at Fuad Editing Zone (FEZ). Specialized in cinematic VFX, premium photo manipulation, and high-impact design." />
    
    <!-- Theme & Icons -->
    <link rel="icon" type="image/png" href="https://dl.dropboxusercontent.com/scl/fi/vvk2qlo8i0mer2n4sip1h/faeez-logo.png?rlkey=xiahu40vwixf0uf96wwnvqlw2&raw=1" />
    <meta name="theme-color" content="#000000" />
    
    <style>
      :root { --background-base: #000000; --accent-base: #dc2626; }
      html, body { margin: 0; background-color: var(--background-base); font-family: 'Montserrat', sans-serif; color: #ffffff; overflow-x: hidden; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none !important; }
      h1, h2, h3, h4 { font-family: 'Teko', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
      
      /* BULLETPROOF CLERK FIXES: Prevent clipping & apply Selected Legend VFX Glow */
      
      /* Target the user button popover (dropout) */
      .cl-userButtonPopoverCard {
        position: fixed !important;
        z-index: 99999 !important;
        overflow: visible !important;
        border: 1px solid rgba(220, 38, 38, 0.4) !important;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8), 
                    0 0 20px rgba(220, 38, 38, 0.2), 
                    0 0 40px rgba(59, 130, 246, 0.1) !important; /* Red/Blue VFX Glow */
      }

      /* Target the main account/profile modal */
      .cl-modalContent {
        max-width: 95vw !important;
        max-height: 90vh !important;
        border: 1px solid rgba(220, 38, 38, 0.5) !important;
        box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), 0 0 60px rgba(59, 130, 246, 0.15) !important;
      }

      /* Mobile Center & Force Fit */
      @media (max-width: 767px) {
        .cl-userButtonPopoverCard {
          left: 50% !important;
          right: auto !important;
          transform: translateX(-50%) !important;
          width: 92vw !important;
          max-width: 400px !important;
          top: 80px !important;
        }
        
        .cl-modalBackdrop {
          padding: 10px !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }
        
        .cl-card {
          width: 100% !important;
          max-width: 95vw !important;
          margin: 0 auto !important;
        }
      }

      /* Desktop Safe Alignment */
      @media (min-width: 1024px) {
        .cl-userButtonPopoverCard {
          right: 2.5rem !important;
          left: auto !important;
          top: 4.5rem !important;
        }
      }

      .cl-modalBackdrop {
        pointer-events: none !important;
        background: rgba(0,0,0,0.6) !important;
        backdrop-filter: none !important;
        z-index: 999998 !important;
      }
      
      .cl-modalContent {
        pointer-events: auto !important;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px !important;
        display: block !important;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #dc2626 !important;
        border-radius: 10px !important;
      }
    </style>
