    <style>
      :root { --background-base: #050505; --accent-base: #ff0000; }
      html, body { margin: 0; background-color: var(--background-base); font-family: 'Montserrat', sans-serif; color: #ffffff; overflow-x: hidden; scrollbar-width: none; }
      ::-webkit-scrollbar { display: none !important; }
      h1, h2, h3, h4 { font-family: 'Teko', sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
      
      /* FORM ANTI-SCROLL & TERMINAL STYLE */
      input, textarea, select {
        overscroll-behavior: contain !important;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* OWNER BADGE STYLE */
      .owner-badge {
        background: #ff0000 !important;
        color: white !important;
        padding: 2px 8px !important;
        border-radius: 4px !important;
        font-weight: 900 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.1em !important;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.6) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        font-size: 8px !important;
      }

      /* NEON GLOWS: SELECTED LEGEND THEME */
      .sent-bubble, .order-sent {
        background: rgba(220, 38, 38, 0.12) !important;
        border: 1px solid rgba(255, 0, 0, 0.4) !important;
        box-shadow: 0 0 35px rgba(255, 0, 0, 0.12) !important;
        backdrop-filter: blur(14px);
      }
      
      .received-bubble, .status-update {
        background: rgba(37, 99, 235, 0.12) !important;
        border: 1px solid rgba(59, 130, 246, 0.4) !important;
        box-shadow: 0 0 35px rgba(59, 130, 246, 0.12) !important;
        backdrop-filter: blur(14px);
      }

      /* NEON RED BRANDING GLOW */
      .neon-glow-red {
        text-shadow: 0 0 10px rgba(220, 38, 38, 0.8), 0 0 20px rgba(220, 38, 38, 0.4);
      }

      /* CLERK DARK MODE OVERRIDES */
      .cl-modalBackdrop { background: rgba(0,0,0,0.96) !important; backdrop-filter: blur(15px) !important; }
      .cl-card { background-color: #0a0a0a !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; }

      /* Scrollbar for dashboard */
      .custom-scrollbar::-webkit-scrollbar { width: 4px !important; display: block !important; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 0, 0, 0.5) !important; border-radius: 10px !important; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent !important; }

      @media (max-width: 767px) {
        .cl-userButtonPopoverCard { right: 1.5rem !important; top: 5rem !important; }
      }
    </style>
